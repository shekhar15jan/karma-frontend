server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;
    include /etc/nginx/mime.types;

    # Docker's embedded DNS. Resolved once per `valid` window instead of once
    # at nginx startup — without this, proxy_pass caches karma-api's IP for
    # the life of the worker process, so any time that container is recreated
    # (redeploy, restart, or the host waking from sleep and Docker Desktop's
    # WSL2 VM renumbering its bridge network) every proxied request 502s until
    # nginx itself is restarted. Variable-based proxy_pass below forces nginx
    # to re-resolve through this on each cache expiry.
    resolver 127.0.0.11 valid=10s;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;

    location /api/ {
        set $karma_api http://karma-api:8000;
        proxy_pass $karma_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location /health {
        set $karma_api http://karma-api:8000;
        rewrite ^/health$ /actuator/health break;
        proxy_pass $karma_api;
        proxy_set_header Host $host;
    }

    location /metrics {
        set $karma_api http://karma-api:8000;
        proxy_pass $karma_api;
        proxy_set_header Host $host;
    }

    location /ws {
        set $karma_api http://karma-api:8000;
        proxy_pass $karma_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    location = /version.json {
        default_type application/json;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
