<div class="flex flex-col h-[calc(100vh-160px)] overflow-hidden select-none gap-6">
  <!-- Title Header -->
  <div class="lightning-panel p-4 rounded-xl flex justify-between items-center shrink-0">
    <div class="flex items-center gap-3">
      <span class="material-symbols-outlined text-primary text-2xl">storefront</span>
      <div>
        <h2 class="text-sm font-bold uppercase tracking-widest text-on-surface mb-0 leading-none">AI Integration Marketplace</h2>
        <span class="text-[9px] font-mono text-on-surface-variant uppercase tracking-wider mt-1 block">Download workflow rendering presets, hooks generators, and agent configurations</span>
      </div>
    </div>
  </div>

  <!-- Marketplace Grid -->
  <div class="flex-grow overflow-y-auto no-scrollbar pb-6">
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
      @for (item of items; track item.id) {
        <div class="lightning-panel rounded-xl p-5 flex flex-col justify-between gap-4 border border-outline-variant/25 hover:border-primary/45 transition-colors shadow-[0_0_15px_rgba(0,229,255,0.05)]">
          <div class="flex justify-between items-start">
            <div>
              <h4 class="text-xs font-bold uppercase tracking-wider text-on-surface mb-0.5">{{ item.name }}</h4>
              <span class="px-2 py-0.5 rounded bg-primary/10 border border-primary/20 text-primary-container text-[8px] font-bold uppercase tracking-wider block w-fit mt-1">
                {{ item.category }}
              </span>
            </div>
            
            <div class="flex items-center gap-1 text-[10px] text-orange-400 font-bold">
              <span class="material-symbols-outlined text-xs">star</span>
              {{ item.rating }}
            </div>
          </div>

          <!-- Description -->
          <p class="text-xs text-on-surface-variant leading-relaxed">{{ item.description }}</p>

          <!-- Downloads count -->
          <div class="flex justify-between items-center border-t border-outline-variant/20 pt-2.5">
            <span class="text-[9px] font-mono text-on-surface-variant uppercase">{{ item.downloads }} downloads</span>
            
            <button 
              class="px-3 py-1 text-[10px] font-bold rounded-lg border transition-all flex items-center gap-1 cursor-pointer"
              [class]="item.installed ? 'bg-green-500/10 border-green-500/20 text-green-400 cursor-default' : 'bg-primary/10 border-primary/20 hover:bg-primary/20 text-on-surface'"
              (click)="!item.installed && installItem(item)"
            >
              <span class="material-symbols-outlined text-xs">{{ item.installed ? 'check_circle' : 'download' }}</span>
              {{ item.installed ? 'Installed' : 'Download' }}
            </button>
          </div>
        </div>
      }
    </div>
  </div>
</div>
